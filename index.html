<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Free AI Paraphraser</title>
 
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      max-width: 800px;
      margin: 40px auto;
      padding: 0 20px;
      background: #f9f9f9;
    }

    .box {
      background: white;
      padding: 24px;
      border-radius: 12px;
      box-shadow: 0 2px 10px #00000010;
    }

    h2 {
      margin-bottom: 10px;
    }

    .limit {
      color: #666;
      font-size: 14px;
      margin-bottom: 10px;
    }

    textarea {
      width: 100%;
      height: 180px;
      padding: 12px;
      margin: 10px 0;
      border: 1px solid #ddd;
      border-radius: 8px;
      resize: vertical;
      font-size: 15px;
      line-height: 1.5;
    }

    button {
      background: #007bff;
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 15px;
    }

    button:disabled {
      background: #999;
      cursor: not-allowed;
    }

    .result {
      margin-top: 20px;
      padding: 16px;
      background: #f1f1f1;
      border-radius: 8px;
      min-height: 100px;
      white-space: pre-wrap;
      line-height: 1.6;
    }

    .tg {
      margin-top: 20px;
      text-align: center;
      color: #333;
      font-size: 15px;
    }

    .tg a {
      color: #007bff;
      font-weight: bold;
      text-decoration: none;
    }

    .small {
      margin-top: 10px;
      font-size: 13px;
      color: #777;
    }
  </style>
</head>

<body>
  <div class="box">
    <h2>Free AI Paraphraser | Rewrite Text</h2>

    <p class="limit" id="limitText">
      Free daily uses, no login needed.
    </p>

    <textarea id="input" placeholder="Paste your text here..."></textarea>

    <button id="btn" onclick="rewrite()">Paraphrase</button>

    <div class="result" id="result"></div>

    <p class="small">
      Tip: Paste your text above and click Paraphrase.
    </p>
  </div>

  <div class="tg">
    Unlimited use →
    Telegram:
    <a href="https://t.me/YourTelegramUsername" target="_blank">@Broksum Chen</a>
  </div>

  <script>
    const DAILY_LIMIT = 3;

    function getTodayKey() {
      const today = new Date().toISOString().slice(0, 10);
      return "paraphrase_count_" + today;
    }

    function getTodayCount() {
      return Number(localStorage.getItem(getTodayKey()) || "0");
    }

    function setTodayCount(count) {
      localStorage.setItem(getTodayKey(), String(count));
    }

    function updateLimitText() {
      const used = getTodayCount();
      const left = Math.max(DAILY_LIMIT - used, 0);

      document.getElementById("limitText").innerText =
        `Free daily uses: ${left}/${DAILY_LIMIT} remaining. No login needed.`;
    }

    async function rewrite() {
      const resultBox = document.getElementById("result");
      const button = document.getElementById("btn");
      const text = document.getElementById("input").value.trim();

      const used = getTodayCount();

      if (used >= DAILY_LIMIT) {
        resultBox.innerText = "Daily limit reached. DM Telegram for unlimited use.";
        return;
      }

      if (!text) {
        alert("Enter text");
        return;
      }

      if (text.length > 5000) {
        alert("Text is too long. Please keep it under 5000 characters.");
        return;
      }

      resultBox.innerText = "Processing...";
      button.disabled = true;
      button.innerText = "Processing...";

      try {
        const res = await fetch("/api/rewrite", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            text: text
          })
        });

        const data = await res.json();

        if (!res.ok) {
          resultBox.innerText = data.error || "API error. Please try again.";
          return;
        }

        resultBox.innerText = data.result || "Error: No response.";

        setTodayCount(used + 1);
        updateLimitText();

      } catch (error) {
        console.error(error);
        resultBox.innerText = "Network error. Please try again later.";
      } finally {
        button.disabled = false;
        button.innerText = "Paraphrase";
      }
    }

    updateLimitText();
  </script>
</body>
</html>
